name: release
on:
  # Automatically release when a version tag is pushed.
  push:
    tags:
      - '*'
  # Allow releasing an already-existing tag manually. workflow_dispatch runs this
  # file from the default branch, so the tag to release is passed as an input and
  # checked out explicitly below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. 0.9.0)'
        required: true
jobs:
  publish:
    name: Push podspec to CocoaPods trunk
    runs-on: macos-15
    env:
      # The tag being released: the dispatch input when run manually, otherwise
      # the pushed tag.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Verify podspec version matches the tag
        run: |
          SPEC_VERSION=$(grep -E "s\.version" SwiftCentrifuge.podspec | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          echo "Tag: $TAG, podspec version: $SPEC_VERSION"
          if [ "$SPEC_VERSION" != "$TAG" ]; then
            echo "::error::podspec version ($SPEC_VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          # CocoaPods trunk is flaky: it occasionally 500s on the push response even
          # though the version was actually accepted, and/or the CDN needs a moment to
          # catch up. Retry, and treat "duplicate entry" as success since that only
          # happens once our version is already published (whether by this attempt's
          # predecessor or an earlier CI run).
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt $attempt of $max_attempts..."
            if output=$(pod trunk push SwiftCentrifuge.podspec --allow-warnings 2>&1); then
              echo "$output"
              echo "Push succeeded."
              exit 0
            fi
            echo "$output"
            if echo "$output" | grep -qi "Unable to accept duplicate entry"; then
              echo "Version $TAG is already present on trunk (duplicate entry) - treating as success."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Push failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::pod trunk push failed after $max_attempts attempts (see log above)."
          exit 1
